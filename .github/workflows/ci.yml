name: CI

# Integración continua: valida cada pull request y cada push a main.
# Tres trabajos independientes y en paralelo: backend, frontend e imagen de contenedor.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un solo pipeline vivo por rama: un push nuevo cancela el anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — pruebas y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache de Sonar
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Compilar, probar y verificar la cobertura
        # `verify` ejecuta pruebas unitarias y de integración (Testcontainers usa el
        # Docker preinstalado en el runner) y aplica el umbral de JaCoCo del pom.
        run: ./mvnw -B -ntp verify

      - name: Analizar backend con SonarQube Cloud
        # Se analiza main hasta confirmar que el proyecto está vinculado al repo.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B -ntp sonar:sonar

      - name: Publicar el resumen de cobertura
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, pathlib

          reporte = pathlib.Path("target/site/jacoco/jacoco.csv")
          print("## Cobertura de líneas")
          if not reporte.exists():
              print("No se generó el reporte de JaCoCo.")
              raise SystemExit(0)

          perdidas = cubiertas = 0
          with reporte.open(newline="", encoding="utf-8") as archivo:
              for fila in csv.DictReader(archivo):
                  perdidas += int(fila["LINE_MISSED"])
                  cubiertas += int(fila["LINE_COVERED"])

          total = perdidas + cubiertas
          porcentaje = cubiertas / total if total else 0
          print(f"- Líneas cubiertas: {cubiertas} de {total}")
          print(f"- Porcentaje: {porcentaje:.2%}")
          print("- Umbral exigido por los lineamientos: 65%")
          PY

      - name: Guardar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-backend
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7
          if-no-files-found: warn

  frontend:
    name: Frontend — tipos, pruebas y empaquetado
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Pruebas unitarias y de integración
        run: npm test

      - name: Empaquetar para producción
        run: npm run build

      - name: Guardar el empaquetado
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  imagen:
    name: Imagen de contenedor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen que usa Render
        # Sin publicar: el objetivo es detectar un Dockerfile roto antes del despliegue.
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: reservaya/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
