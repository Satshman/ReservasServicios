# Alertmanager local: envía las alertas por correo a Mailpit (http://localhost:8025), el mismo SMTP de pruebas
# que usa la app. En producción se cambiaría el receptor (correo real, Slack, Teams) por variables de entorno.
global:
  smtp_smarthost: mailpit:1025
  smtp_from: alertas@reservas.local
  smtp_require_tls: false

route:
  receiver: equipo
  group_by: [alertname, severidad]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - matchers: [severidad="critica"]
      receiver: equipo
      repeat_interval: 30m

receivers:
  - name: equipo
    email_configs:
      - to: equipo@reservas.local
        send_resolved: true
        headers:
          Subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severidad }})'

inhibit_rules:
  # Si la app está caída, no se envían además las alertas que dependen de que responda.
  - source_matchers: [alertname="AplicacionCaida"]
    target_matchers: [severidad=~"advertencia|informativa"]
