# Configuración de Prometheus para el entorno local (docker-compose.observabilidad.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: reservas-servicios
    metrics_path: /actuator/prometheus
    static_configs:
      # Puerto de gestión de la app: solo accesible dentro de la red del compose.
      - targets: ["app:8091"]
        labels:
          entorno: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
