# Blueprint de Render — despliega la aplicación como contenedor a partir del Dockerfile.
# La base de datos es PostgreSQL administrado en Neon: sus credenciales se piden
# al crear el Blueprint (sync: false) y nunca se versionan aquí.
services:
  - name: reservas-servicios
    type: web
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      # Secreto de firma de los JWT: Render genera un valor aleatorio.
      - key: JWT_SECRET
        generateValue: true
      # Conexión a Neon. DB_URL con el formato:
      # jdbc:postgresql://<host>.neon.tech/<base>?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # URL pública del servicio; se usa en el enlace de verificación por correo.
      - key: APP_BASE_URL
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      # Proveedor SMTP real (Mailpit solo sirve en desarrollo).
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_SMTP_STARTTLS
        value: "true"
      - key: APP_MAIL_FROM
        sync: false
      - key: JWT_EXPIRATION
        value: 30m
      - key: SWAGGER_ENABLED
        value: "true"
